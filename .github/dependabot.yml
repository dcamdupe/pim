# Routine version updates. Security updates are raised separately, as advisories appear.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /FrontEnd
      - /FrontEnd.UnitTests
      - /FunctionalTests
      - /FileDownloader
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directories:
      - /Api
      - /Api.UnitTests
      - /Api.IntegrationTests
    schedule:
      interval: weekly
    ignore:
      # Microsoft.OpenApi 3.x needs Microsoft.AspNetCore.OpenApi 11 (.NET 11).
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /Terraform
      - /Terraform/bootstrap
    schedule:
      interval: weekly
    groups:
      terraform-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
