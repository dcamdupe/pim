name: Deploy Downloader

# Manual only - builds and pushes the FileDownloader image to ECR and registers a new ECS task
# definition revision, same "deploy touches real AWS, so it's a deliberate trigger-time choice"
# convention as deploy.yml/terraform.yml.
#
# The EventBridge Scheduler target (Terraform/modules/downloader) references the task definition
# *family*, not a pinned revision, so registering a new revision here is enough - the next
# scheduled run picks it up automatically, no need to touch the schedule itself.
#
# Requires the same AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repo secrets as deploy.yml/
# terraform.yml, plus three repo variables copied by hand from `terraform output` after applying
# the downloader module (see Terraform/README.md):
#   DOWNLOADER_ECR_REPOSITORY_URL, DOWNLOADER_ECS_CLUSTER, DOWNLOADER_TASK_FAMILY
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (matches the repo variables above)
        type: choice
        options:
          - production
        default: production

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FileDownloader
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${{ vars.DOWNLOADER_ECR_REPOSITORY_URL }}:${{ github.sha }}"
          LATEST="${{ vars.DOWNLOADER_ECR_REPOSITORY_URL }}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      # Terraform's own aws_ecs_task_definition (modules/downloader/main.tf) has
      # lifecycle.ignore_changes on container_definitions specifically so this workflow - not
      # Terraform - is what registers day-to-day image updates, same convention as the API
      # Lambda's deployment package (see Terraform/README.md).
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.DOWNLOADER_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with the freshly-pushed image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: FileDownloader/task-definition.json
          container-name: downloader
          image: ${{ vars.DOWNLOADER_ECR_REPOSITORY_URL }}:${{ github.sha }}

      - run: aws ecs register-task-definition --cli-input-json "file://${{ steps.render.outputs.task-definition }}"
