name: Functional tests

on:
  push:
    branches: [main]
    paths:
      - "Api/**"
      - "FrontEnd/**"
      - "FunctionalTests/**"
      - "scripts/create_dynamodb_tables.sh"
      - "scripts/seed_test_login.sh"
      - "Pim.sln"
      - ".github/workflows/functional-tests.yml"
  pull_request:
    paths:
      - "Api/**"
      - "FrontEnd/**"
      - "FunctionalTests/**"
      - "scripts/create_dynamodb_tables.sh"
      - "scripts/seed_test_login.sh"
      - "Pim.sln"
      - ".github/workflows/functional-tests.yml"

jobs:
  functional-test:
    name: Functional test
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            FrontEnd/package-lock.json
            FunctionalTests/package-lock.json

      - name: Install htpasswd (for seed_test_login.sh)
        run: sudo apt-get update -qq && sudo apt-get install -y apache2-utils

      - run: scripts/create_dynamodb_tables.sh
      - run: scripts/seed_test_login.sh

      # Runs over plain HTTP rather than the HTTPS profile local dev uses - avoids needing to
      # trust a self-signed dev cert in Playwright's headless Chromium on a fresh runner.
      # Api/Program.cs only calls UseHttpsRedirection() outside the Local environment, so HTTP-only
      # works fine here. Backgrounded with nohup/disown so it survives past this step.
      - name: Start Api
        run: |
          ASPNETCORE_ENVIRONMENT=Local nohup dotnet run --project Api --urls http://localhost:5037 > api.log 2>&1 &
          disown

      - name: Wait for Api to be ready
        run: |
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:5037/ >/dev/null 2>&1 && break
            if [ "$attempt" -eq 90 ]; then
              echo "error: Api did not become ready on http://localhost:5037" >&2
              cat api.log
              exit 1
            fi
            sleep 1
          done

      - run: npm ci
        working-directory: FrontEnd

      - run: npm ci
        working-directory: FunctionalTests

      - run: npx playwright install --with-deps chromium
        working-directory: FunctionalTests

      - name: Run Playwright tests
        run: npm test
        working-directory: FunctionalTests
        env:
          VITE_API_BASE_URL: http://localhost:5037

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FunctionalTests/playwright-report
          retention-days: 7
