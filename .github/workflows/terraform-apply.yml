name: Terraform Apply

# Manual only - applies a plan produced by a previous, separately-triggered
# "Terraform Plan" run. Requires that run's ID (visible in its Actions run
# URL, e.g. .../actions/runs/1234567890) so the exact reviewed plan gets
# applied rather than one regenerated on the fly.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply (matches environments/<name>.tfvars)
        type: choice
        options:
          - production
        default: production
      plan_run_id:
        description: Run ID of the "Terraform Plan" workflow run to apply
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: "1.9.8"

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform workspace select ${{ inputs.environment }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: Terraform
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - run: terraform apply tfplan
