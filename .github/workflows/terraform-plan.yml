name: Terraform Plan

# Manual only - produces a plan and uploads it as an artifact for review.
# Does not apply anything. Once reviewed, run "Terraform Apply" separately,
# passing this run's ID, to actually apply it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan (matches environments/<name>.tfvars)
        type: choice
        options:
          - production
        default: production

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: "1.9.8"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform workspace select -or-create=true ${{ inputs.environment }}
      - run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: Terraform/tfplan
          retention-days: 3
