name: Deploy Terraform

# Manual only (never runs on push) - choose `action: plan` to preview, or `action: apply` to
# also apply it. Authenticates to AWS via OIDC (see Terraform/README.md); the deliberate apply
# choice at trigger time is the only gate, consistent with this project's serial single-operator model.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to target (matches environments/<name>.tfvars)
        type: choice
        options:
          - production
        default: production
      action:
        description: Plan only, or plan and apply
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: "1.9.8"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The Lambda deployment package (modules/api/main.tf's data.archive_file.api)
      # needs this build to exist on disk, and `terraform plan` zips it into
      # modules/api/build.zip. That zip - not the raw build/ directory - is what
      # aws_lambda_function.api reads, and `terraform apply` on a saved plan does
      # not recreate it, so it's passed to the apply job as an artifact instead of
      # being rebuilt there (which also wouldn't guarantee the same bytes/hash -
      # dotnet publish output isn't byte-reproducible across separate runs).
      - name: Publish Api for Lambda
        working-directory: ${{ github.workspace }}
        run: dotnet publish Api -c Release -r linux-x64 --self-contained false -o Terraform/modules/api/build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform workspace select -or-create=true ${{ inputs.environment }}
      - run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan
        env:
          # Google OAuth client for Cognito's Google IdP - deliberately not in a
          # committed tfvars file, same "outside Terraform state's committed inputs" pattern as
          # the OIDC role. Only needed at plan time: apply runs from the saved tfplan
          # artifact, which already has these resolved, so the apply job below doesn't need them.
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: Terraform/tfplan
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: api-lambda-build
          path: Terraform/modules/api/build.zip
          retention-days: 1

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: inputs.action == 'apply'
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: api-lambda-build
          path: Terraform/modules/api
      - run: terraform init
      - run: terraform workspace select ${{ inputs.environment }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: Terraform
      - run: terraform apply tfplan
