name: Terraform

# Manual only - this can apply real changes to AWS, so it never runs on push.
# Choose `action: plan` to just see what would change, or `action: apply` to
# also apply it (in the same run, using the exact plan just produced).
#
# Requires two repo secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, for a
# dedicated least-privilege IAM user (never root credentials - see
# Terraform/README.md). Also requires the state bucket in Terraform/backend.tf
# to already exist (via Terraform/bootstrap) with its placeholder replaced.
#
# No environment/required-reviewers gate: that GitHub feature needs a paid
# plan on a private repo. The deliberate action: apply choice at trigger
# time is the only gate - consistent with this project's existing "one
# person, applies done serially" model (see backend.tf/bootstrap/main.tf).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to target (matches environments/<name>.tfvars)
        type: choice
        options:
          - production
        default: production
      action:
        description: Plan only, or plan and apply
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: "1.9.8"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform workspace select -or-create=true ${{ inputs.environment }}
      - run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: Terraform/tfplan
          retention-days: 1

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: inputs.action == 'apply'
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform workspace select ${{ inputs.environment }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: Terraform
      - run: terraform apply tfplan
