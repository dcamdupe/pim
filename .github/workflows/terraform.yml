name: Terraform

# Manual only - this can apply real changes to AWS, so it never runs on push.
# Requires two repo secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, for a
# dedicated least-privilege IAM user (never root credentials - see
# Terraform/README.md). Also requires the state bucket in Terraform/backend.tf
# to already exist (via Terraform/bootstrap) with its placeholder replaced.
#
# The apply job runs under the "production" GitHub Environment - configure
# required reviewers on that environment (repo Settings > Environments) so an
# apply still needs a manual approval even though the trigger itself is
# already manual.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply (matches environments/<name>.tfvars)
        type: choice
        options:
          - production
        default: production

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: "1.9.8"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform workspace select -or-create=true ${{ inputs.environment }}
      - run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: Terraform/tfplan
          retention-days: 1

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform workspace select ${{ inputs.environment }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: Terraform
      - run: terraform apply tfplan
