<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1169 610" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1169" height="610" fill="#ffffff" />

  <!-- Browser -->
  <rect x="40" y="380" width="150" height="60" rx="8" fill="#f5f5f5" stroke="#666666" />
  <text x="115" y="415" text-anchor="middle">Browser (User)</text>

  <!-- FrontEnd group -->
  <rect x="260" y="180" width="240" height="320" rx="8" fill="#dae8fc" stroke="#6c8ebf" />
  <text x="380" y="200" text-anchor="middle" font-weight="bold">FrontEnd &#8212; Vue 3 + TypeScript SPA</text>
  <rect x="290" y="230" width="180" height="40" rx="6" fill="#ffffff" stroke="#6c8ebf" />
  <text x="380" y="254" text-anchor="middle">vue-router</text>
  <rect x="290" y="290" width="180" height="50" rx="6" fill="#ffffff" stroke="#6c8ebf" />
  <text x="380" y="311" text-anchor="middle">Pinia stores</text>
  <text x="380" y="327" text-anchor="middle" font-size="10">(incl. auth / JWT token)</text>
  <rect x="290" y="360" width="180" height="40" rx="6" fill="#ffffff" stroke="#6c8ebf" />
  <text x="380" y="384" text-anchor="middle">Views / Components</text>
  <rect x="290" y="420" width="180" height="40" rx="6" fill="#ffffff" stroke="#6c8ebf" />
  <text x="380" y="444" text-anchor="middle">HTTP client (fetch)</text>

  <!-- Api group -->
  <rect x="580" y="140" width="280" height="420" rx="8" fill="#d5e8d4" stroke="#82b366" />
  <text x="720" y="160" text-anchor="middle" font-weight="bold">Api &#8212; .NET Core Web API (Pim.Api)</text>
  <rect x="610" y="190" width="220" height="40" rx="6" fill="#ffffff" stroke="#82b366" />
  <text x="720" y="214" text-anchor="middle">Auth / JWT validation middleware</text>
  <rect x="610" y="250" width="220" height="40" rx="6" fill="#ffffff" stroke="#82b366" />
  <text x="720" y="274" text-anchor="middle">Controllers</text>
  <rect x="610" y="310" width="220" height="40" rx="6" fill="#ffffff" stroke="#82b366" />
  <text x="720" y="334" text-anchor="middle">Services (business logic)</text>
  <rect x="610" y="370" width="220" height="50" rx="6" fill="#ffffff" stroke="#82b366" />
  <text x="720" y="391" text-anchor="middle">IRepository&lt;T&gt; /</text>
  <text x="720" y="406" text-anchor="middle">DynamoDbRepository&lt;T&gt;</text>

  <!-- Internal flow arrows -->
  <line x1="720" y1="230" x2="720" y2="250" stroke="#82b366" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <line x1="720" y1="290" x2="720" y2="310" stroke="#82b366" marker-end="url(#arrow)" />
  <line x1="720" y1="350" x2="720" y2="370" stroke="#82b366" marker-end="url(#arrow)" />

  <!-- DynamoDB -->
  <g stroke="#d79b00" fill="#ffe6cc">
    <path d="M940,352 a90,12 0 0 1 180,0 v70 a90,12 0 0 1 -180,0 z" />
    <ellipse cx="1030" cy="352" rx="90" ry="12" />
  </g>
