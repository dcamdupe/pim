.726-.589-2.406-.94l-.91 1.799c.791.41 1.716.772 2.752 1.08m-2.752-13.21.91-1.801c.68.352 1.49.668 2.406.94l-.564 1.94a16 16 0 0 1-2.752-1.08"/></g></svg>
  <text x="1030" y="390" text-anchor="middle">DynamoDB</text>
  <text x="1030" y="405" text-anchor="middle" font-size="10">(DynamoDB Local in dev,</text>
  <text x="1030" y="418" text-anchor="middle" font-size="10">real DynamoDB in AWS)</text>

  <!-- Edges -->
  <line x1="190" y1="410" x2="258" y2="345" stroke="#333333" marker-end="url(#arrow)" />
  <text x="200" y="380" font-size="11">HTTPS</text>

  <line x1="500" y1="340" x2="578" y2="345" stroke="#333333" marker-end="url(#arrow)" />
  <text x="505" y="110" font-size="11">HTTPS REST/JSON</text>
  <text x="505" y="124" font-size="11">Authorization: Bearer &lt;JWT&gt;</text>
  <line x1="620" y1="130" x2="700" y2="140" stroke="none" />

  <line x1="830" y1="395" x2="938" y2="395" stroke="#333333" marker-end="url(#arrow)" />
  <text x="855" y="385" font-size="11">AWS SDK for .NET</text>

  <text x="260" y="545" font-style="italic" font-size="11">POST /login &#8594; issues JWT; FrontEnd stores it in a Pinia store and attaches it as a</text>
  <text x="260" y="560" font-style="italic" font-size="11">Bearer token on every subsequent request. See AuthorizationTests.cs / ProtectedEndpoints().</text>
</svg>
