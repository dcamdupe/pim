<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIM Spending Trends</title>
<style>
:root {
  --page-bg: #f2f4f8;
  --bg: #ffffff;
  --field-bg: #f7f6f9;
  --border: #e5e4e7;
  --text: #6b6375;
  --text-h: #08060d;
  --accent: #0f766e;
  --accent-soft: rgba(15, 118, 110, 0.10);
  --up: #c62f2f;
  --up-soft: rgba(211, 51, 51, 0.11);
  --down: #0b8a0b;
  --down-soft: rgba(12, 163, 12, 0.12);
  --grid: #ecebef;
  --bar: #cfd3dc;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.10);
  --sans: system-ui, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page-bg: #0e0f13; --bg: #16171d; --field-bg: #1d1f27; --border: #2e303a;
    --text: #9ca3af; --text-h: #f3f4f6; --accent: #2dd4bf; --accent-soft: rgba(45,212,191,.12);
    --up: #f87171; --up-soft: rgba(248,113,113,.14); --down: #4ade80; --down-soft: rgba(74,222,128,.13);
    --grid: #252731; --bar: #3a3d4a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page-bg: #0e0f13; --bg: #16171d; --field-bg: #1d1f27; --border: #2e303a;
  --text: #9ca3af; --text-h: #f3f4f6; --accent: #2dd4bf; --accent-soft: rgba(45,212,191,.12);
  --up: #f87171; --up-soft: rgba(248,113,113,.14); --down: #4ade80; --down-soft: rgba(74,222,128,.13);
  --grid: #252731; --bar: #3a3d4a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { color: var(--text-h); margin: 0; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* App chrome */
.nav { background: var(--bg); border-bottom: 1px solid var(--border); }
.nav-inner { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 24px; height: 52px; overflow-x: auto; }
.brand { font-weight: 800; color: var(--text-h); letter-spacing: .02em; }
.nav a { color: var(--text); text-decoration: none; font-weight: 500; white-space: nowrap; padding-block: 15px; border-bottom: 2px solid transparent; }
.nav a.active { color: var(--text-h); border-bottom-color: var(--accent); }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 20px; }

.sample-note { align-self: flex-start; font-size: 12px; background: var(--field-bg); border: 1px dashed var(--border); border-radius: 6px; padding: 4px 10px; }

/* Page header */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.page-head h1 { font-size: 26px; font-weight: 700; }
.page-head p { margin: 4px 0 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stepper { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
.stepper button { background: none; border: 0; padding: 7px 11px; cursor: pointer; color: var(--text); }
.stepper button:hover { color: var(--text-h); }
.stepper span { padding: 7px 4px; font-weight: 600; color: var(--text-h); min-width: 150px; text-align: center; }
.chip { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.chip b { color: var(--text-h); font-weight: 600; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.stat .value { font-size: 22px; font-weight: 700; color: var(--text-h); }
.stat .sub { font-size: 12px; }

.pill { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; display: inline-block; }
.pill.up { background: var(--up-soft); color: var(--up); }
.pill.down { background: var(--down-soft); color: var(--down); }
.pill.flat { background: var(--field-bg); color: var(--text); }
.pill.tag { background: var(--accent-soft); color: var(--accent); font-family: var(--sans); }

/* Main grid */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: 1fr; } }

.group { display: flex; flex-direction: column; gap: 10px; }
.group + .group { margin-top: 18px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.group-head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--text); font-weight: 700; }
.group-head .total { font-size: 12px; }

.insight { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 0 14px; align-items: center; text-align: left; width: 100%;
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 12px 0; cursor: pointer; box-shadow: none; transition: border-color .15s, box-shadow .15s; }
.insight:hover { border-color: var(--text); }
.insight[aria-pressed="true"] { border-color: var(--accent); box-shadow: var(--shadow); }
.insight .swatch { align-self: stretch; border-radius: 0 3px 3px 0; }
.insight .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.insight .line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.insight .cat { font-weight: 650; color: var(--text-h); }
.insight .headline { color: var(--text-h); }
.insight .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.insight .amount { font-size: 12px; }
.spark { display: block; }

.minor { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.minor summary { cursor: pointer; padding: 11px 14px; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
.minor summary::-webkit-details-marker { display: none; }
.minor summary::after { content: '▾'; }
.minor[open] summary::after { content: '▴'; }
.minor table { width: 100%; border-collapse: collapse; font-size: 13px; }
.minor td { padding: 8px 14px; border-top: 1px solid var(--border); }
.minor td:last-child { text-align: right; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

/* Detail panel */
.detail { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 880px) { .detail { position: static; } }
.detail-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px; }
.detail-head h3 { font-size: 18px; }
.detail-head p { margin: 2px 0 0; color: var(--text-h); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.fact { background: var(--field-bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.fact .v { color: var(--text-h); font-weight: 600; font-size: 15px; }
@media (max-width: 420px) { .facts { grid-template-columns: 1fr 1fr; } }
.chart-box { overflow-x: auto; }
.chart-box svg { display: block; width: 100%; height: auto; min-width: 320px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px dashed var(--text); vertical-align: 3px; margin-right: 6px; }
.legend i.solid { border-top: 8px solid var(--accent); height: 0; border-radius: 2px; vertical-align: 1px; }

.drivers h4 { margin: 0 0 6px; font-size: 13px; color: var(--text-h); }
.table-scroll { overflow-x: auto; }
.drivers table { width: 100%; border-collapse: collapse; font-size: 13px; }
.drivers th { text-align: right; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.drivers th:first-child, .drivers td:first-child { text-align: left; padding-left: 0; }
.drivers td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.drivers td:first-child { color: var(--text-h); white-space: normal; }
.drivers td .meta { color: var(--text); font-size: 12px; display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.link-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; }
.link-btn:hover { border-color: var(--accent); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<nav class="nav" aria-label="Main">
  <div class="nav-inner">
    <span class="brand">PIM</span>
    <a href="#">Dashboard</a>
    <a href="#">Transactions</a>
    <a href="#" class="active" aria-current="page">Insights</a>
    <a href="#">Upload</a>
    <a href="#">Settings</a>
  </div>
</nav>

<main class="wrap">
  <span class="sample-note">Design mockup · example data, not real transactions</span>

  <header class="page-head">
    <div>
      <h1>Spending trends</h1>
      <p>Categories where your spending changed noticeably from one month to the next.</p>
    </div>
    <div class="controls">
      <div class="stepper" role="group" aria-label="Month">
        <button id="prev-month" type="button" aria-label="Previous month">‹</button>
        <span id="month-label">Sep 2026 vs Aug 2026</span>
        <button id="next-month" type="button" aria-label="Next month">›</button>
      </div>
      <button class="chip" id="threshold-chip" type="button">Flag changes over <b>20%</b> and <b>$50</b></button>
    </div>
  </header>

  <section class="summary" aria-label="Summary">
    <div class="stat">
      <span class="kicker">Total spending</span>
      <span class="value num" id="sum-total"></span>
      <span class="sub" id="sum-total-sub"></span>
    </div>
    <div class="stat">
      <span class="kicker">Spending more</span>
      <span class="value num" id="sum-up"></span>
      <span class="sub" id="sum-up-sub"></span>
    </div>
    <div class="stat">
      <span class="kicker">Spending less</span>
      <span class="value num" id="sum-down"></span>
      <span class="sub" id="sum-down-sub"></span>
    </div>
    <div class="stat">
      <span class="kicker">Biggest change</span>
      <span class="value" id="sum-big"></span>
      <span class="sub" id="sum-big-sub"></span>
    </div>
  </section>

  <div class="main">
    <section aria-label="Category changes">
      <div class="group" id="group-up"></div>
      <div class="group" id="group-down"></div>
      <div class="group" id="group-minor"></div>
    </section>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>

</main>

<script>
const MONTHS = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];
const THRESHOLD_PCT = 0.20, THRESHOLD_AMT = 50;

// Example data: six months of expense totals per category (AUD).
const CATEGORIES = [
  { name: 'Groceries', colour: '#16a34a', spend: [612, 640, 598, 655, 760, 972],
    drivers: [['Costco', 'Not seen in August', 0, 186], ['Woolworths', '9 visits, was 6', 412, 552], ['Harris Farm', '', 98, 121], ['Coles', '3 visits, was 5', 250, 113]] },
  { name: 'Dining out', colour: '#ea580c', spend: [310, 285, 340, 295, 420, 248],
    drivers: [['Uber Eats', '4 orders, was 9', 236, 104], ['Restaurants', 'Grouped: 3 descriptions', 142, 96], ['Cafés', 'Grouped: 4 descriptions', 42, 48]] },
  { name: 'Fuel', colour: '#ca8a04', spend: [180, 195, 172, 188, 176, 241],
    drivers: [['Ampol', '4 fills, was 3', 132, 189], ['BP', '', 44, 52]] },
  { name: 'Utilities', colour: '#0891b2', spend: [265, 238, 372, 214, 236, 384],
    drivers: [['AGL Energy', 'Quarterly bill', 0, 151], ['Sydney Water', '', 82, 79], ['Telstra', '', 89, 89], ['Origin Gas', '', 65, 65]] },
  { name: 'Subscriptions', colour: '#7c3aed', spend: [92, 92, 92, 104, 104, 127],
    drivers: [['Netflix', 'Price up from $18.99', 18.99, 22.99], ['Spotify', '', 13.99, 13.99], ['iCloud+', '', 4.49, 4.49], ['New: Disney+', 'First charge', 0, 18.99]] },
  { name: 'Shopping', colour: '#db2777', spend: [420, 380, 515, 610, 690, 305],
    drivers: [['Amazon AU', '3 orders, was 8', 386, 142], ['JB Hi-Fi', 'Not seen in September', 199, 0], ['Kmart', '', 105, 163]] },
  { name: 'Health', colour: '#0d9488', spend: [60, 145, 80, 75, 90, 85], drivers: [] },
  { name: 'Entertainment', colour: '#4f46e5', spend: [120, 95, 140, 110, 125, 118], drivers: [] },
  { name: 'Travel', colour: '#2563eb', spend: [0, 0, 0, 0, 0, 640],
    drivers: [['Qantas', 'Flights, 2 passengers', 0, 512], ['Airbnb', 'Deposit', 0, 128]] },
  { name: 'Insurance', colour: '#64748b', spend: [148, 148, 148, 148, 148, 148], drivers: [] },
];

const money = (v, dp = 0) => '$' + Math.abs(v).toLocaleString('en-AU', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const signed = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + money(v);
const pct = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.round(Math.abs(v) * 100) + '%';

function analyse(c) {
  const s = c.spend, cur = s[5], prev = s[4], change = cur - prev;
  const ratio = prev === 0 ? null : change / prev;
  const prior = s.slice(0, 5);
  const avg = s.reduce((a, b) => a + b, 0) / s.length;
  const tags = [];
  if (prior.every(v => v === 0) && cur > 0) tags.push('New this month');
  else {
    if (cur > Math.max(...prior)) tags.push('Highest in 6 months');
    if (cur < Math.min(...prior)) tags.push('Lowest in 6 months');
    if (s[5] > s[4] && s[4] > s[3] && s[3] > s[2]) tags.push('Rising 3 months');
    if (change > 0 && s[2] > avg * 1.25 && Math.abs(s[2] - cur) / cur < 0.15) tags.push('Looks quarterly');
  }
  const flagged = Math.abs(change) >= THRESHOLD_AMT && (ratio === null || Math.abs(ratio) >= THRESHOLD_PCT);
  return { ...c, cur, prev, change, ratio, avg, tags, flagged };
}

function headline(a) {
  if (a.tags.includes('New this month')) return `${money(a.cur)} spent, nothing in the last 5 months`;
  const dir = a.change > 0 ? 'up' : 'down';
  return `${dir} ${money(a.change)} on August (${money(a.prev)} → ${money(a.cur)})`;
}

function sparkline(spend, colour) {
  const w = 84, h = 26, p = 3, max = Math.max(...spend, 1);
  const pts = spend.map((v, i) => [p + i * (w - 2 * p) / (spend.length - 1), h - p - (v / max) * (h - 2 * p)]);
  const line = pts.map(pt => pt.map(n => n.toFixed(1)).join(',')).join(' ');
  const area = `${p},${h - p} ${line} ${w - p},${h - p}`;
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="${area}" fill="${colour}" fill-opacity="0.12"></polygon>
    <polyline points="${line}" fill="none" stroke="${colour}" stroke-width="1.6" stroke-linejoin="round"></polyline>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="${colour}"></circle></svg>`;
}

function insightCard(a) {
  const cls = a.change > 0 ? 'up' : 'down';
  const pctLabel = a.ratio === null ? 'new' : pct(a.ratio);
  const tags = a.tags.map(t => `<span class="pill tag">${t}</span>`).join('');
  return `<button type="button" class="insight" data-cat="${a.name}" aria-pressed="false">
    <span class="swatch" style="background:${a.colour}"></span>
    <span class="body">
      <span class="line1"><span class="cat">${a.name}</span><span class="pill ${cls}">${pctLabel}</span>${tags}</span>
      <span class="headline">${headline(a)}</span>
    </span>
    <span class="right">${sparkline(a.spend, a.colour)}<span class="amount num">${signed(a.change)}</span></span>
  </button>`;
}

function barChart(a) {
  const W = 520, H = 220, L = 48, R = 12, T = 14, B = 30;
  const max = Math.max(...a.spend, a.avg);
  const step = max > 800 ? 250 : max > 400 ? 100 : 50;
  const top = Math.ceil(max / step) * step || step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const slot = (W - L - R) / a.spend.length, bw = Math.min(46, slot * 0.58);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${a.name} spending, April to September 2026">`;
  for (let v = 0; v <= top; v += step) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"></line>`;
    svg += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text)" font-family="var(--mono)">${money(v)}</text>`;
  }
  a.spend.forEach((v, i) => {
    const x = L + slot * i + (slot - bw) / 2, isCur = i === 5, isPrev = i === 4;
    const fill = isCur ? 'var(--accent)' : isPrev ? 'var(--text)' : 'var(--bar)';
    const op = isPrev ? 0.55 : 1;
    svg += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0) - y(v))}" rx="3" fill="${fill}" fill-opacity="${op}"></rect>`;
    if (isCur || isPrev) svg += `<text x="${x + bw / 2}" y="${y(v) - 5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-h)" font-family="var(--mono)">${money(v)}</text>`;
    svg += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${isCur ? 'var(--text-h)' : 'var(--text)'}" font-weight="${isCur ? 600 : 400}">${MONTHS[i]}</text>`;
  });
  svg += `<line x1="${L}" x2="${W - R}" y1="${y(a.avg)}" y2="${y(a.avg)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4"></line>`;
  return svg + '</svg>';
}

function renderDetail(a) {
  const cls = a.change > 0 ? 'up' : a.change < 0 ? 'down' : 'flat';
  const vsAvg = a.cur - a.avg;
  const drivers = [...a.drivers].sort((x, y) => Math.abs(y[3] - y[2]) - Math.abs(x[3] - x[2]));
  const dp = a.name === 'Subscriptions' ? 2 : 0;
  const rows = drivers.map(([name, meta, prev, cur]) => {
    const d = cur - prev, c = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    return `<tr><td>${name}${meta ? `<span class="meta">${meta}</span>` : ''}</td>
      <td class="num">${money(prev, dp)}</td><td class="num">${money(cur, dp)}</td>
      <td><span class="pill ${c}">${d === 0 ? '—' : (d > 0 ? '+' : '−') + money(d, dp)}</span></td></tr>`;
  }).join('');
  document.getElementById('detail').innerHTML = `
    <div class="detail-head">
      <div><h3>${a.name}</h3><p>${headline(a)}</p></div>
      <span class="pill ${cls}">${a.ratio === null ? 'new' : pct(a.ratio)}</span>
    </div>
    <div class="facts">
      <div class="fact"><span class="kicker">September</span><span class="v num">${money(a.cur)}</span></div>
      <div class="fact"><span class="kicker">August</span><span class="v num">${money(a.prev)}</span></div>
      <div class="fact"><span class="kicker">vs 6-mo avg</span><span class="v num">${signed(Math.round(vsAvg))}</span></div>
    </div>
    <div>
      <div class="chart-box">${barChart(a)}</div>
      <div class="legend"><span><i class="solid"></i>Selected month</span><span><i></i>6-month average ${money(Math.round(a.avg))}</span></div>
    </div>
    ${rows ? `<div class="drivers"><h4>What changed</h4><div class="table-scroll"><table>
      <thead><tr><th>Description</th><th>Aug</th><th>Sep</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table></div></div>` : ''}
    <div class="actions"><button type="button" class="link-btn">View ${a.name.toLowerCase()} transactions for September →</button></div>`;
  document.querySelectorAll('.insight').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === a.name)));
}

const all = CATEGORIES.map(analyse);
const up = all.filter(a => a.flagged && a.change > 0).sort((x, y) => y.change - x.change);
const down = all.filter(a => a.flagged && a.change < 0).sort((x, y) => x.change - y.change);
const minor = all.filter(a => !a.flagged).sort((x, y) => Math.abs(y.change) - Math.abs(x.change));
const sumBy = (list, f) => list.reduce((t, a) => t + f(a), 0);

const totCur = sumBy(all, a => a.cur), totPrev = sumBy(all, a => a.prev);
document.getElementById('sum-total').textContent = money(totCur);
document.getElementById('sum-total-sub').innerHTML = `<span class="pill ${totCur > totPrev ? 'up' : 'down'}">${pct((totCur - totPrev) / totPrev)}</span> ${signed(totCur - totPrev)} on August`;
document.getElementById('sum-up').textContent = up.length + ' categories';
document.getElementById('sum-up-sub').textContent = `${signed(sumBy(up, a => a.change))} combined`;
document.getElementById('sum-down').textContent = down.length + ' categories';
document.getElementById('sum-down-sub').textContent = `${signed(sumBy(down, a => a.change))} combined`;
const big = [...up, ...down].sort((x, y) => Math.abs(y.change) - Math.abs(x.change))[0];
document.getElementById('sum-big').textContent = big.name;
document.getElementById('sum-big-sub').textContent = `${signed(big.change)}${big.ratio === null ? ', new this month' : ', ' + pct(big.ratio)}`;

document.getElementById('group-up').innerHTML =
  `<div class="group-head"><h2>Spending more</h2><span class="total num">${signed(sumBy(up, a => a.change))}</span></div>` + up.map(insightCard).join('');
document.getElementById('group-down').innerHTML =
  `<div class="group-head"><h2>Spending less</h2><span class="total num">${signed(sumBy(down, a => a.change))}</span></div>` + down.map(insightCard).join('');
document.getElementById('group-minor').innerHTML = `<details class="minor">
  <summary><span>Smaller changes · ${minor.length} categories</span></summary>
  <table><tbody>${minor.map(a => `<tr><td><span class="dot" style="background:${a.colour}"></span>${a.name}</td>
    <td class="num">${money(a.prev)} → ${money(a.cur)} <span class="pill ${a.change > 0 ? 'up' : a.change < 0 ? 'down' : 'flat'}">${a.change === 0 ? 'no change' : signed(a.change)}</span></td></tr>`).join('')}</tbody></table>
</details>`;

document.querySelectorAll('.insight').forEach(b => b.addEventListener('click', () => renderDetail(all.find(a => a.name === b.dataset.cat))));
renderDetail(all.find(a => a.name === 'Groceries'));
</script>
</body>
</html>
